# =============================================================================
# CI · Stage 4 BUILD + Stage 5 PACKAGE
#   Build   : compile every component and keep the artifacts (traceable to
#             the commit SHA through the artifact name + build-info.json)
#   Package : build each Docker image locally to prove it is buildable.
#             NOTHING is pushed from CI: publishing approved images is the
#             job of the delivery pipeline (auto-monitor-deployment / CDL),
#             which developers cannot modify -> separation of duties.
# =============================================================================
name: CI · build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: "Build · ${{ matrix.component }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        component: [backend, agent, ws-gateway, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - if: matrix.component == 'backend'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - if: matrix.component == 'backend'
        name: Build jar
        working-directory: backend
        run: |
          mvn -B -ntp -DskipTests package
          mkdir -p ../out && cp target/*.jar ../out/

      - if: matrix.component == 'agent'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - if: matrix.component == 'agent'
        name: Byte-compile agent
        run: |
          python -m compileall -q agent/app
          mkdir -p out && tar czf out/agent-src.tgz -C agent app requirements.txt

      - if: matrix.component == 'ws-gateway' || matrix.component == 'frontend'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - if: matrix.component == 'ws-gateway'
        name: Build ws-gateway
        working-directory: ws-gateway
        run: |
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p ../out && tar czf ../out/ws-gateway-dist.tgz dist
      - if: matrix.component == 'frontend'
        name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p ../out && tar czf ../out/frontend-output.tgz .output

      - name: Write build-info.json (traceability)
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          cat > out/build-info.json <<EOF
          {
            "component": "${COMPONENT}",
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "built_by": "${GITHUB_ACTOR}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          (cd out && sha256sum ./* > SHA256SUMS)
          cat out/build-info.json out/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.component }}-${{ github.sha }}
          path: out/
          retention-days: 14

  package:
    name: "Package · ${{ matrix.component }}"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        component: [backend, agent, ws-gateway, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build container image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.component }}
          push: false
          tags: auto-monitor-${{ matrix.component }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
