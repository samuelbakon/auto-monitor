# =============================================================================
# CI · Stage 2 · TEST
# Runs every automated test suite that exists in the repository and keeps the
# JUnit reports as evidence (downloaded later by the delivery pipeline).
#   backend    : Maven  -> JUnit 5           (mvn verify)
#   agent      : Python -> pytest            (15 tests)
#   ws-gateway : Node   -> vitest            (4 tests)
#   frontend   : Nuxt   -> type-check only   (no unit tests exist yet = gap)
# =============================================================================
name: CI · test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: backend (Java 21 / Maven)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: mvn verify (compile + unit tests)
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Keep test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report-backend
          path: backend/target/surefire-reports/
          retention-days: 30
          if-no-files-found: warn

  agent:
    name: agent (Python 3.12 / pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install dependencies
        working-directory: agent
        run: pip install -r requirements.txt
      - name: pytest
        working-directory: agent
        run: |
          mkdir -p reports
          python -m pytest -q --junitxml=reports/junit.xml
      - name: Keep test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report-agent
          path: agent/reports/
          retention-days: 30
          if-no-files-found: warn

  ws-gateway:
    name: ws-gateway (Node 22 / vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ws-gateway/package-lock.json
      - name: npm ci + type-check build
        working-directory: ws-gateway
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: vitest
        working-directory: ws-gateway
        run: npx vitest run --reporter=default --reporter=junit --outputFile=reports/junit.xml
      - name: Keep test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report-ws-gateway
          path: ws-gateway/reports/
          retention-days: 30
          if-no-files-found: warn

  frontend:
    name: frontend (Nuxt type-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci + nuxi typecheck
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Record test gap
        run: echo "::notice::frontend has no unit tests yet - only type-checking runs (documented limitation L-03)"
