
name: monitor

networks:
  monitor-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_memory
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      monitor-net: { ipv4_address: 172.28.0.20 }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && psql -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc 'SELECT 1 FROM agent_state LIMIT 1' >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.4
    container_name: monitor-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: monitor
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      monitor-net: { ipv4_address: 172.28.0.21 }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent && mysql -u root -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1' monitor >/dev/null",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    container_name: monitor-backend
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/monitor
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      AGENT_URL: http://agent:8000
      WS_URL: http://ws-gateway:4000
    networks:
      monitor-net: { ipv4_address: 172.28.0.12 }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  agent:
    build: ./agent
    container_name: monitor-agent
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      backend: { condition: service_started }
    environment:
      PG_DSN: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/agent_memory
      BACKEND_URL: http://backend:8080
      WS_URL: http://ws-gateway:4000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-mistral,openai}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      HEARTBEAT_MINUTES: ${HEARTBEAT_MINUTES:-5}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-2000000}
      REPOS_DIR: /data/repos
    volumes:
      - ./data/repos:/data/repos
    networks:
      monitor-net: { ipv4_address: 172.28.0.13 }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8000/readyz', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ws-gateway:
    build: ./ws-gateway
    container_name: monitor-ws
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy}
      backend: { condition: service_started }
    environment:
      PORT: 4000
      BACKEND_URL: http://backend:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      ALLOWED_ORIGIN: ${PUBLIC_URL}
    ports:
      - "4000:4000"
    networks:
      monitor-net: { ipv4_address: 172.28.0.11 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/readyz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: monitor-frontend
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
      ws-gateway: { condition: service_healthy }
    environment:
      NUXT_BACKEND_URL: http://backend:8080
      NUXT_WS_INTERNAL_URL: http://ws-gateway:4000
      NUXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL}
    ports:
      - "3000:3000"
    networks:
      monitor-net: { ipv4_address: 172.28.0.10 }
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/_health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
