server:
  port: 8080

spring:
  application:
    name: monitor-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/monitor}
    username: ${SPRING_DATASOURCE_USERNAME:monitor}
    password: ${SPRING_DATASOURCE_PASSWORD:monitor}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,jwks,agent

app:
  internal-token: ${INTERNAL_API_TOKEN:}
  jwt-private-key: ${JWT_PRIVATE_KEY:}
  encryption-key: ${ENCRYPTION_KEY:}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:admin}
  agent-url: ${AGENT_URL:http://localhost:8000}
  ws-url: ${WS_URL:http://localhost:4000}
